       ========================================================================= */

      { day: 6,  label: "3/7 (日)",  isDark: true,  groupIdx: 2, localIdx: 0, mapQuery: "Lake Shikotsu",                 skyGrad: "linear-gradient(180deg, #0C192C 0%, #1E3A5F 52%, #3B6998 100%)" },
      { day: 7,  label: "3/8 (一)",  isDark: true,  groupIdx: 3, localIdx: 0, mapQuery: "Noboribetsu Onsen",             skyGrad: "linear-gradient(180deg, #090A10 0%, #1D162B 52%, #382342 100%)" },
      { day: 8,  label: "3/9 (二)",  isDark: false, groupIdx: 4, localIdx: 0, mapQuery: "Lake Toya",                     skyGrad: "linear-gradient(180deg, #93C5FD 0%, #DBEAFE 55%, #F8FAFC 100%)" },
      { day: 9,  label: "3/10 (三)", isDark: true,  groupIdx: 4, localIdx: 1, mapQuery: "Otaru Canal",                   skyGrad: "linear-gradient(180deg, #091326 0%, #172A4A 52%, #29436B 100%)" },
      { day: 10, label: "3/11 (四)", isDark: true,  groupIdx: 4, localIdx: 2, mapQuery: "Sapporo PARCO Tanukikoji",      skyGrad: "linear-gradient(180deg, #130D26 0%, #2A1B4E 52%, #46296E 100%)" },
      { day: 11, label: "3/12 (五)", isDark: true,  groupIdx: 4, localIdx: 3, mapQuery: "Odori Park Sapporo",            skyGrad: "linear-gradient(180deg, #0D1326 0%, #1E294B 52%, #334168 100%)" },
      { day: 12, label: "3/13 (六)", isDark: false, groupIdx: 4, localIdx: 4, mapQuery: "New Chitose Airport",           skyGrad: "linear-gradient(180deg, #FDBA74 0%, #FED7AA 42%, #FEF08A 78%, #FFFBEB 100%)" }
    ];

    let DAYS_DATA = [];
    let maxTimelineNodes = 6;

    async function loadScheduleJsonData() {
      let rawSchedule = null;
      const params = new URLSearchParams(window.location.search);
      const jsonUrl = params.get("json") || "./schedule.json";

      try {
        const res = await fetch(jsonUrl, { cache: "no-store" });
        if (res.ok) {
          rawSchedule = await res.json();
        }
      } catch (_) {}

      if (!rawSchedule) {
        const fallbackEl = document.getElementById("default-schedule-json");
        rawSchedule = JSON.parse(fallbackEl.textContent);
      }

      if (!Array.isArray(rawSchedule) || rawSchedule.length !== 12) {
        throw new Error("schedule.json must be an Array of exactly 12 days (index 0 to 11).");
      }

      DAYS_DATA = SCENE_VISUAL_PRESETS.map((preset, idx) => {
        const dayItems = rawSchedule[idx];
        if (!Array.isArray(dayItems) || dayItems.length === 0) {
          throw new Error(`Day index ${idx} (${preset.label}) in schedule.json must be a non-empty Array of schedule items.`);
        }
        return {
          ...preset,
          items: dayItems.map(item => ({
            time: String(item.time),
            title: String(item.title),
            subtitle: String(item.subtitle)
          }))
        };
      });

      maxTimelineNodes = Math.max(1, ...DAYS_DATA.map(d => d.items.length));
    }

    // Group Definitions for the 5 Cityscape Panorama Groups
    // Intra-group swipes pan with multi-layer parallax; Inter-group swipes slide 1:1 with the finger!
    const SCENE_GROUPS = [
      { groupIdx: 0, startDay: 0, endDay: 2, panStepPx: 54 }, // 3/2 ~ 3/4: Sapporo JR Tower Night + Arriving Jet on 3/2
      { groupIdx: 1, startDay: 3, endDay: 4, panStepPx: 88 }, // 3/5 ~ 3/6: Asahikawa Penguins -> Biei Christmas Tree & Wedding
      { groupIdx: 2, startDay: 5, endDay: 5, panStepPx: 0  }, // 3/7: Lake Shikotsu Red Bridge, Swans & Lakeside Rotemburo
      { groupIdx: 3, startDay: 6, endDay: 6, panStepPx: 0  }, // 3/8: Noboribetsu Hell Valley Crater & Milky Sulfur Rotemburo
      { groupIdx: 4, startDay: 7, endDay: 11, panStepPx: 68 } // 3/9 ~ 3/13: Lake Toya Bus -> Otaru -> Odori Ferris/Clock -> Sunset Jet
    ];

    // ============================================================================
    // 2. INITIALIZE 12 GPU SKY LAYERS & SINGLE-ROW TOP BAR
    // ============================================================================
    let skyLayerEls = [];
    let storySlotEls = [];
    let lastRenderedTopBarDay = -1;
    let lastRenderedTopBarDark = null;

    function initSkyLayers() {
      const stack = document.getElementById("sky-stack");
      stack.innerHTML = DAYS_DATA.map((d, idx) => `
        <div class="sky-layer" style="background: ${d.skyGrad}; opacity: ${idx === 0 ? 1 : 0}; visibility: ${idx === 0 ? 'visible' : 'hidden'};"></div>
      `).join("");
      skyLayerEls = Array.from(stack.querySelectorAll(".sky-layer"));
    }

    function initTopStoryBar() {
      const track = document.getElementById("story-bar-track");
      track.innerHTML = DAYS_DATA.map((d, idx) => `
        <div data-day="${idx}" class="story-slot flex items-center justify-center py-2">
          <div class="story-seg pointer-events-none"></div>
        </div>
      `).join("");
      storySlotEls = Array.from(track.querySelectorAll(".story-slot"));
    }

    function updateTopStoryBar(activeDayIdx, isDarkSky) {
      if (activeDayIdx === lastRenderedTopBarDay && isDarkSky === lastRenderedTopBarDark) {
        return;
      }
      lastRenderedTopBarDay = activeDayIdx;
      lastRenderedTopBarDark = isDarkSky;

      for (let i = 0; i < storySlotEls.length; i++) {
        const slot = storySlotEls[i];
        const seg = slot.firstElementChild;
        if (i === activeDayIdx) {
          const d = DAYS_DATA[i];
          slot.className = "story-slot shrink-0 py-1 flex items-center justify-center";
          seg.className = "story-seg pointer-events-none px-3.5 py-1 rounded-full bg-slate-900 text-white text-[17px] font-black shadow-md border-2 border-white flex items-center gap-1.5 whitespace-nowrap";
          seg.style.cssText = "";
          seg.innerHTML = `<span class="text-rose-400">Day ${d.day}</span><span>${d.label}</span>`;
        } else {
          slot.className = "story-slot flex-1 min-w-[8px] py-2.5 flex items-center justify-center";
          seg.className = "story-seg pointer-events-none w-full h-[8px] rounded-full";
          // High-visibility styling on both dark night backgrounds and bright day backgrounds
          if (isDarkSky) {
            seg.style.cssText = i < activeDayIdx
              ? "background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(255, 255, 255, 0.95); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);"
              : "background: rgba(255, 255, 255, 0.55); border: 1px solid rgba(255, 255, 255, 0.88); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);";
          } else {
            seg.style.cssText = i < activeDayIdx
              ? "background: rgba(15, 23, 42, 0.50); border: 1px solid rgba(255, 255, 255, 0.9);"
              : "background: rgba(30, 41, 59, 0.28); border: 1px solid rgba(255, 255, 255, 0.8);";
          }
          if (seg.innerHTML !== "") seg.innerHTML = "";
        }
      }
    }

    // ============================================================================
    // 6. UNIFIED CONTINUOUS FLOATING-POINT POSITION & PHYSICS ENGINE (`currentPos` in [0.0 .. 11.0])
    // Driven by a single continuous rAF loop: zero CSS transition toggles, zero DOM thrashing,
    // only 2 active schedule/sky panels composited at any moment!
    // ============================================================================
    let curDayIdx = 0;
    let targetDayIdx = 0;
    let currentPos = 0;
    let currentDayFloat = 0;
    let isPointerDragging = false;
    let physicsRafId = null;
    let cachedViewportWidth = 400;

    function updateViewportWidth() {
      const shell = document.getElementById("app-shell");
      if (shell) cachedViewportWidth = shell.clientWidth || 400;
    }
    window.addEventListener("resize", updateViewportWidth);

    function renderAtPos(pos) {
      const maxIdx = DAYS_DATA.length - 1;
      const clamped = Math.max(0, Math.min(maxIdx, pos));
      currentDayFloat = clamped;

      const idxA = Math.floor(clamped);
      const idxB = Math.min(maxIdx, idxA + 1);
      const t = clamped - idxA;
      const viewportWidth = cachedViewportWidth;

      // 1. Update 12 Pre-Allocated GPU Sky Layers (Only idxA & idxB visible = minimal GPU overdraw!)
      for (let i = 0; i < skyLayerEls.length; i++) {
        const el = skyLayerEls[i];
        if (i === idxA || i === idxB) {
          const op = (i === idxA) ? (1 - t) : t;
          if (el.style.visibility !== "visible") el.style.visibility = "visible";
          el.style.opacity = op.toFixed(3);
        } else {
          if (el.style.visibility !== "hidden") {
            el.style.opacity = "0";
            el.style.visibility = "hidden";
          }
        }
      }

      // 2. Update Fixed Left Timeline Rail (Stationary line + Keynote Magic Move nodes)
      renderTimelineInterpolation(idxA, idxB, t);

      // 3. Update 12 Pre-Allocated Schedule Panels (Only idxA & idxB visible on GPU!)
      for (let i = 0; i < schedulePanelEls.length; i++) {
        const panel = schedulePanelEls[i];
        if (i === idxA || i === idxB) {
          if (panel.style.visibility !== "visible") panel.style.visibility = "visible";
          const offsetDays = i - pos; // Continuous offset even during rubber-band overscroll
          const x = (offsetDays * viewportWidth).toFixed(1);
          const op = Math.max(0, 1 - Math.abs(offsetDays) * 0.85).toFixed(3);
          panel.style.opacity = op;
          panel.style.transform = `translate3d(${x}px, 0, 0)`;
        } else {
          if (panel.style.visibility !== "hidden") {
            panel.style.opacity = "0";
            panel.style.visibility = "hidden";
          }
        }
      }

      // 4. Update 5 Cityscape Groups (Intra-group = Parallax Pan; Inter-group = 1:1 Viewport Slide)
      const groupA = DAYS_DATA[idxA].groupIdx;
      const groupB = DAYS_DATA[idxB].groupIdx;

      for (let g = 0; g < SCENE_GROUPS.length; g++) {
        const grp = SCENE_GROUPS[g];
        const clipEl = groupClipEls[g];
        const layers = groupLayersMap[g];

        let clipX = 0;
        let localDayOffset = 0;
        let visible = true;

        if (groupA === groupB) {
          if (g === groupA) {
            clipX = 0;
            localDayOffset = clamped - grp.startDay;
          } else {
            visible = false;
          }
        } else {
          if (g === groupA) {
            clipX = -t * viewportWidth;
            localDayOffset = idxA - grp.startDay;
          } else if (g === groupB) {
            clipX = (1 - t) * viewportWidth;
            localDayOffset = idxB - grp.startDay;
          } else {
            visible = false;
          }
        }

        if (!visible) {
          if (clipEl.style.visibility !== "hidden") {
            clipEl.style.visibility = "hidden";
            clipEl.style.transform = `translate3d(${viewportWidth * 1.2}px, 0, 0)`;
          }
        } else {
          if (clipEl.style.visibility !== "visible") clipEl.style.visibility = "visible";
          clipEl.style.transform = `translate3d(${clipX.toFixed(1)}px, 0, 0)`;
          const shift = -localDayOffset * grp.panStepPx;
          if (layers.bg)  layers.bg.style.transform  = `translate3d(${(shift * 0.38).toFixed(1)}px, 0, 0)`;
          if (layers.mid) layers.mid.style.transform = `translate3d(${(shift * 0.68).toFixed(1)}px, 0, 0)`;
          if (layers.fg)  layers.fg.style.transform  = `translate3d(${(shift * 1.00).toFixed(1)}px, 0, 0)`;
        }
      }

      // 5. Day 1 (3/2 -> 3/3) Foreground Arriving Plane Animation (Flies off to upper-left)
      if (day1PlaneEl) {
        if (clamped <= 1.2) {
          const p = Math.max(0, Math.min(1, clamped));
          const px = (-p * 240).toFixed(1);
          const py = (-p * 60).toFixed(1);
          const op = Math.max(0, 1 - p * 1.05).toFixed(3);
          day1PlaneEl.style.opacity = op;
          day1PlaneEl.style.transform = `translate3d(${px}px, ${py}px, 0) rotate(-7deg)`;
        } else if (day1PlaneEl.style.opacity !== "0") {
          day1PlaneEl.style.opacity = "0";
        }
      }

      // 6. Day 12 (3/12 -> 3/13) Departing Plane Animation (Flies in from right edge)
      if (day12PlaneEl) {
        if (clamped >= 9.8) {
          const p = Math.max(0, Math.min(1, clamped - 10)); // 0 at Day 11 (3/12), 1 at Day 12 (3/13)
          const px = ((1 - p) * 240).toFixed(1);
          const py = ((1 - p) * 28).toFixed(1);
          const op = Math.max(0, Math.min(1, p * 1.15)).toFixed(3);
          day12PlaneEl.style.opacity = op;
          day12PlaneEl.style.transform = `translate3d(${px}px, ${py}px, 0) rotate(-13deg)`;
        } else if (day12PlaneEl.style.opacity !== "0") {
          day12PlaneEl.style.opacity = "0";
        }
      }

      // 7. Update Top Bar Active Pill & Contrast Mode (Cached so it only touches DOM when day changes)
      const nearestDay = Math.round(clamped);
      const nearestDark = DAYS_DATA[nearestDay].isDark;
      updateTopStoryBar(nearestDay, nearestDark);
    }

    function stepPhysicsLoop() {
      physicsRafId = null;

      if (isPointerDragging) {
        renderAtPos(currentPos);
        return;
      }

      const diff = targetDayIdx - currentPos;
      if (Math.abs(diff) > 0.0015) {
        // High-response exponential spring glide (60/120fps interruptible at any frame!)
        currentPos += diff * 0.26;
        renderAtPos(currentPos);
        physicsRafId = requestAnimationFrame(stepPhysicsLoop);
      } else {
        currentPos = targetDayIdx;
        curDayIdx = targetDayIdx;
        renderAtPos(currentPos);
      }
    }

    function ensurePhysicsLoop() {
      if (!physicsRafId) {
        physicsRafId = requestAnimationFrame(stepPhysicsLoop);
      }
    }

    function glideToDay(nextTargetIdx) {
      const clampedTarget = Math.max(0, Math.min(DAYS_DATA.length - 1, nextTargetIdx));
      targetDayIdx = clampedTarget;
      curDayIdx = clampedTarget;
      ensurePhysicsLoop();
    }

    // ============================================================================
    // 3. FIXED LEFT TIMELINE RAIL + KEYNOTE MAGIC MOVE NODES
    // ============================================================================
    let timelineLineEl = null;
    let tlNodeEls = [];

    function initTimelineRail() {
      timelineLineEl = document.getElementById("timeline-line");
      const container = document.getElementById("timeline-nodes-container");
      let html = "";
      for (let i = 0; i < maxTimelineNodes; i++) {
        html += `
          <div class="tl-node" style="top: 0%; opacity: 0;">
            <div class="tl-time-wrap">
              <span class="tl-time-label tl-time-a">00:00</span>
              <span class="tl-time-label tl-time-b" style="opacity: 0;">00:00</span>
            </div>
            <div class="tl-dot"></div>
          </div>
        `;
      }
      container.innerHTML = html;
      tlNodeEls = Array.from(container.querySelectorAll(".tl-node"));
    }

    function getEvenPct(index, count) {
      if (count <= 1) return 50;
      const clampedIdx = Math.min(index, count - 1);
      return (clampedIdx / (count - 1)) * 100;
    }

    // Interpolates timeline nodes smoothly along the stationary vertical line between dayA and dayB
    function renderTimelineInterpolation(dayIdxA, dayIdxB, t) {
      const dayA = DAYS_DATA[dayIdxA];
      const dayB = DAYS_DATA[dayIdxB];
      const itemsA = dayA.items;
      const itemsB = dayB.items;
      const countA = itemsA.length;
      const countB = itemsB.length;
      const maxCount = Math.max(countA, countB);

      const useDarkTheme = (t < 0.5) ? dayA.isDark : dayB.isDark;
      timelineLineEl.style.backgroundColor = useDarkTheme
        ? "rgba(255, 255, 255, 0.38)"
        : "rgba(15, 23, 42, 0.28)";

      const textColor = useDarkTheme ? "#FFFFFF" : "#0F172A";
      const dotBg = useDarkTheme ? "#F43F5E" : "#0F172A";
      const dotBorder = useDarkTheme ? "2px solid #FFFFFF" : "2px solid #FFFFFF";

      for (let i = 0; i < maxTimelineNodes; i++) {
        const nodeEl = tlNodeEls[i];
        if (i >= maxCount) {
          nodeEl.style.opacity = "0";
          continue;
        }

        const pctA = getEvenPct(i, countA);
        const pctB = getEvenPct(i, countB);
        const curPct = pctA + (pctB - pctA) * t;

        const existsInA = i < countA;
        const existsInB = i < countB;
        let nodeOpacity = 1;
        let scale = 1;
        if (existsInA && !existsInB) {
          nodeOpacity = 1 - t;
          scale = 1 - 0.25 * t;
        } else if (!existsInA && existsInB) {
          nodeOpacity = t;
          scale = 0.75 + 0.25 * t;
        }

        nodeEl.style.top = `${curPct.toFixed(2)}%`;
        nodeEl.style.opacity = nodeOpacity.toFixed(3);

        const timeAEl = nodeEl.querySelector(".tl-time-a");
        const timeBEl = nodeEl.querySelector(".tl-time-b");
        const dotEl = nodeEl.querySelector(".tl-dot");

        const strA = itemsA[Math.min(i, countA - 1)].time;
        const strB = itemsB[Math.min(i, countB - 1)].time;

        if (timeAEl.textContent !== strA) timeAEl.textContent = strA;
        if (timeBEl.textContent !== strB) timeBEl.textContent = strB;

        timeAEl.style.color = textColor;
        timeBEl.style.color = textColor;
        const timeShadow = useDarkTheme ? "0 1px 6px rgba(0,0,0,0.55)" : "0 1px 6px rgba(255,255,255,0.9)";
        timeAEl.style.textShadow = timeShadow;
        timeBEl.style.textShadow = timeShadow;

        if (strA === strB) {
          timeAEl.style.opacity = "1";
          timeBEl.style.opacity = "0";
        } else {
          timeAEl.style.opacity = (1 - t).toFixed(3);
          timeBEl.style.opacity = t.toFixed(3);
        }

        dotEl.style.backgroundColor = dotBg;
        dotEl.style.border = dotBorder;
        dotEl.style.transform = `scale(${scale.toFixed(2)})`;
      }
    }

    // ============================================================================
    // 4. PRE-RENDERED SCHEDULE PANELS (ZERO EMOJIS, ALIGNED TO TIMELINE NODES)
    // ============================================================================
    let schedulePanelEls = [];

    function initSchedulePanels() {
      const stage = document.getElementById("schedule-stage");
      stage.innerHTML = DAYS_DATA.map((d, dayIdx) => {
        const count = d.items.length;
        const titleColor = d.isDark ? "text-white text-glow-dark" : "text-slate-950 text-glow-light";
        const noteColor  = d.isDark ? "text-slate-200 text-glow-dark" : "text-slate-800 text-glow-light";
        // Automatically scale typography slightly if a day has 7+ items so rows never overlap
        const titleSizeCls = count >= 8 ? "text-[15.5px]" : (count === 7 ? "text-[16.5px]" : "text-[18px]");
        const subSizeCls   = count >= 8 ? "text-[13px]"   : (count === 7 ? "text-[13.5px]" : "text-[14.5px]");

        const rowsHtml = d.items.map((item, i) => {
          const pct = getEvenPct(i, count).toFixed(2);
          return `
            <div class="schedule-item-row" style="top: ${pct}%;">
              <div class="${titleSizeCls} font-black leading-snug tracking-tight ${titleColor} truncate">${item.title}</div>
              ${item.subtitle ? `<div class="${subSizeCls} font-bold leading-snug ${noteColor} truncate mt-0.5">${item.subtitle}</div>` : ""}
            </div>
          `;
        }).join("");

        return `
          <div class="day-schedule-panel" data-day="${dayIdx}"
               style="opacity: ${dayIdx === 0 ? 1 : 0}; transform: translate3d(${dayIdx === 0 ? 0 : 100}%, 0, 0);">
            ${rowsHtml}
          </div>
        `;
      }).join("");

      schedulePanelEls = Array.from(stage.querySelectorAll(".day-schedule-panel"));
    }

    // ============================================================================
    // 5. 5-GROUP MULTI-LAYER PARALLAX CITYSCAPES + BIG AIRPLANES (ZERO ARTIFACTS)
    // ============================================================================
    let groupClipEls = [];
    let groupLayersMap = [];
    let day1PlaneEl = null;
    let day12PlaneEl = null;

    // Reusable Pure-Vector Modern Jetliner Silhouette (Zero dashed lines, zero odd dots!)
    function getCleanJetlinerSVG(fillColor, windowColor, strokeColor = "#0f172a") {
      return `
        <!-- Sleek swept-wing passenger jetliner in foreground side-profile -->
        <polygon points="72,19 94,6 105,6 88,19" fill="#e2e8f0" stroke="${strokeColor}" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M 8,28
                 C 20,20 38,18 56,18
                 L 118,18
                 L 139,3
                 L 152,3
                 L 141,20
                 L 148,24
                 C 141,28 128,30 114,30
                 L 82,30
                 L 59,47
                 L 44,47
                 L 63,30
                 L 26,30
                 C 15,30 8,29 8,28 Z"
              fill="${fillColor}" stroke="${strokeColor}" stroke-width="1.6" stroke-linejoin="round"/>
        <!-- Under-wing turbofan engine nacelle -->
        <rect x="66" y="32" width="17" height="6.5" rx="3.2" fill="#f8fafc" stroke="${strokeColor}" stroke-width="1.4"/>
        <!-- Cockpit windshield & clean cabin windows -->
        <polygon points="16,25 26,21.5 28,25 18,26" fill="${windowColor}"/>
        <rect x="35" y="23" width="5.5" height="3" rx="1" fill="${windowColor}"/>
        <rect x="44" y="23" width="5.5" height="3" rx="1" fill="${windowColor}"/>
        <rect x="53" y="23" width="5.5" height="3" rx="1" fill="${windowColor}"/>
        <rect x="62" y="23" width="5.5" height="3" rx="1" fill="${windowColor}"/>
        <rect x="71" y="23" width="5.5" height="3" rx="1" fill="${windowColor}"/>
        <rect x="80" y="23" width="5.5" height="3" rx="1" fill="${windowColor}"/>
        <rect x="89" y="23" width="5.5" height="3" rx="1" fill="${windowColor}"/>
        <rect x="98" y="23" width="5.5" height="3" rx="1" fill="${windowColor}"/>
        <rect x="107" y="23" width="5.5" height="3" rx="1" fill="${windowColor}"/>
      `;
    }

    function initCityscapeGroups() {
      const container = document.getElementById("scene-groups-container");

      // ------------------------------------------------------------------------
      // GROUP 0 (Days 1–3: 3/2 ~ 3/4): SAPPORO JR TOWER SKYLINE + FOREGROUND ARRIVING JET
      // Crescent moon drawn as a SINGLE pure SVG <path> (Zero overlapping mask circle!)
      // ------------------------------------------------------------------------
      const group0Html = `
        <div class="scene-group-clip" data-group="0">
          <!-- Far Layer (0.38x): Distant Teine Mountains & Pure-Path Crescent Moon -->
          <div class="parallax-layer parallax-bg" style="width: 620px;">
            <svg viewBox="0 0 620 205" class="w-full h-full block" preserveAspectRatio="none">
              <!-- Pure single-path crescent moon (No dark overlay circle = Zero box/circle artifact on 3/4->3/5!) -->
              <path d="M 455 24 A 15 15 0 1 1 439 42 A 12 12 0 1 0 455 24 Z" fill="#fef08a" opacity="0.92"/>
              <path d="M -20,205 L -20,136 L 85,96 L 195,132 L 325,88 L 455,128 L 560,94 L 640,134 L 640,205 Z" fill="#1e293b" opacity="0.55"/>
            </svg>
          </div>

          <!-- Mid Layer (0.68x): Elevated Sapporo JR Viaduct & Illuminated Express Train -->
          <div class="parallax-layer parallax-mid" style="width: 620px;">
            <svg viewBox="0 0 620 205" class="w-full h-full block" preserveAspectRatio="none">
              <rect x="0" y="152" width="620" height="6" fill="#334155"/>
              <rect x="0" y="149.5" width="620" height="2.5" fill="#ffffff"/>
              <!-- Viaduct Pillars Anchored to Snow Ground -->
              <rect x="64" y="158" width="10" height="42" fill="#1e293b"/>

    // ============================================================================
    // 7. FULL-SCREEN 100DVH PARTICLE CANVAS (SNOW + ONSEN STEAM + NIGHT GLOW, ZERO FIREWORKS)
    // ============================================================================
    function initFullScreenParticles() {
      const canvas = document.getElementById("fx-canvas");
      const ctx = canvas.getContext("2d");
      let width = 400;
      let height = 800;

      function resize() {
        const rect = canvas.parentElement.getBoundingClientRect();
        width = Math.max(1, rect.width);
        height = Math.max(1, rect.height);
        canvas.width = width;
        canvas.height = height;
      }
      resize();
      window.addEventListener("resize", resize);

      // Snowflakes
      const snowflakes = Array.from({ length: 24 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        r: 1.8 + Math.random() * 2.4,
        vy: 0.45 + Math.random() * 0.65,
        vx: -0.25 + Math.random() * 0.5,
        alpha: 0.45 + Math.random() * 0.45
      }));

      // Soft Rising Onsen Steam Clouds (Rises naturally from bottom pool into mid-screen with zero hard clipping!)
      const steamPuffs = Array.from({ length: 18 }, (_, i) => ({
        x: width * (0.18 + (i / 18) * 0.72),
        y: height - 35 - Math.random() * 190,
        r: 16 + Math.random() * 22,
        vy: 0.42 + Math.random() * 0.35,
        swayPhase: Math.random() * Math.PI * 2
      }));

      // Subtle Floating Warm Golden Streetlamp / Starlight Glows for Romantic Nights (Replaces fireworks)
      const nightGlows = Array.from({ length: 12 }, () => ({
        x: Math.random() * width,
        y: height - 50 - Math.random() * 180,
        r: 1.8 + Math.random() * 2.2,
        vy: 0.22 + Math.random() * 0.28,
        phase: Math.random() * Math.PI * 2
      }));

      function drawFrame() {
        ctx.clearRect(0, 0, width, height);

        // 1. Gentle Snowfall
        for (let i = 0; i < snowflakes.length; i++) {
          const s = snowflakes[i];
          s.y += s.vy;
          s.x += s.vx;
          if (s.y > height + 10) {
            s.y = -10;
            s.x = Math.random() * width;
          }
          if (s.x < -10) s.x = width + 10;
          if (s.x > width + 10) s.x = -10;

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha.toFixed(2)})`;
          ctx.fill();
        }

        // 2. Rising Hot Spring Steam (Active around Day 6 Lake Shikotsu & Day 7 Noboribetsu: dayFloat in [4.2 .. 6.8])
        const onsenDist = Math.min(Math.abs(currentDayFloat - 5), Math.abs(currentDayFloat - 6));
        const steamIntensity = Math.max(0, 1 - onsenDist * 1.15);

        if (steamIntensity > 0.02) {
          const baseLineY = height - 42;
          for (let i = 0; i < steamPuffs.length; i++) {
            const p = steamPuffs[i];
            p.y -= p.vy;
            p.swayPhase += 0.02;
            const curX = p.x + Math.sin(p.swayPhase) * 8;

            const riseDist = baseLineY - p.y;
            const maxRise = 230;
            if (riseDist > maxRise || p.y < 0) {
              p.y = baseLineY + Math.random() * 12;
              p.x = (currentDayFloat > 5.5)
                ? width * (0.20 + Math.random() * 0.68) // Hell Valley + Rotemburo
                : width * (0.64 + Math.random() * 0.26); // Lakeside Rotemburo
            } else if (riseDist > 0) {
              const lifeRatio = riseDist / maxRise;
              const fade = Math.sin(lifeRatio * Math.PI) * 0.34 * steamIntensity;
              const radius = p.r * (0.8 + lifeRatio * 0.9);

              const grad = ctx.createRadialGradient(curX, p.y, 1, curX, p.y, radius);
              grad.addColorStop(0, `rgba(255, 255, 255, ${fade.toFixed(3)})`);
              grad.addColorStop(1, "rgba(255, 255, 255, 0)");
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(curX, p.y, radius, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }

        // 3. Subtle Warm Night Streetlamp Glow Particles on Otaru / Sapporo Nights (Days 9–11: dayFloat in [7.6 .. 10.4])
        const isNightCity = (currentDayFloat >= 7.6 && currentDayFloat <= 10.4);
        if (isNightCity) {
          const baseLineY = height - 48;
          for (let i = 0; i < nightGlows.length; i++) {
            const g = nightGlows[i];
            g.y -= g.vy;
            g.phase += 0.04;
            if (g.y < height - 220) {
              g.y = baseLineY;
              g.x = width * (0.12 + Math.random() * 0.76);
            }
            const twinkle = (0.25 + 0.25 * Math.sin(g.phase)).toFixed(2);
            ctx.beginPath();
            ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(254, 240, 138, ${twinkle})`;
            ctx.fill();
          }
        }

        requestAnimationFrame(drawFrame);
      }

      requestAnimationFrame(drawFrame);
    }

    // ============================================================================
    // 8. GESTURE ENGINE: TOP BAR SCRUB + CONTINUOUS 2D SWIPE + LEFT/RIGHT TAP
    // ============================================================================
    // 8. UNIFIED POINTER GESTURE ENGINE (ZERO DUPLICATE TOUCH+MOUSE TAP BUG,
    //    INSTANT INTERRUPTIBLE RAPID SWIPING & TOP BAR SCRUBBING)
    // ============================================================================
    function initTopBarScrubbing() {
      const track = document.getElementById("story-bar-track");
      let activeScrubPointerId = null;
      let rectLeft = 0;
      let rectWidth = 1;

      function updateRect() {
        const r = track.getBoundingClientRect();
        rectLeft = r.left;
        rectWidth = Math.max(1, r.width);
      }

      function getDayAtX(clientX, checkExactSlot) {
        if (checkExactSlot) {
          for (let i = 0; i < storySlotEls.length; i++) {
            const sr = storySlotEls[i].getBoundingClientRect();
            if (clientX >= sr.left - 3 && clientX <= sr.right + 3) return i;
          }
        }
        const ratio = Math.max(0, Math.min(0.9999, (clientX - rectLeft) / rectWidth));
        return (ratio * DAYS_DATA.length) | 0;
      }

      function jumpToX(clientX, checkExactSlot) {
        const target = getDayAtX(clientX, checkExactSlot);
        isPointerDragging = false;
        curDayIdx = target;
        targetDayIdx = target;
        currentPos = target;
        renderAtPos(target);
      }

      track.addEventListener("pointerdown", (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        e.stopPropagation();
        activeScrubPointerId = e.pointerId;
        if (track.setPointerCapture) {
          try { track.setPointerCapture(e.pointerId); } catch (_) {}
        }
        updateRect();
        jumpToX(e.clientX, true);
      });

      track.addEventListener("pointermove", (e) => {
        if (activeScrubPointerId === null || e.pointerId !== activeScrubPointerId) return;
        e.stopPropagation();
        jumpToX(e.clientX, false);
      });

      function endScrub(e) {
        if (activeScrubPointerId === null || e.pointerId !== activeScrubPointerId) return;
        activeScrubPointerId = null;
      }

      track.addEventListener("pointerup", endScrub);
      track.addEventListener("pointercancel", endScrub);
    }

    function initStageSwipeAndTap() {
      const shell = document.getElementById("app-shell");
      let activePointerId = null;
      let isHorizontalDrag = false;
      let startX = 0;
      let startY = 0;
      let dragStartPos = 0;
      let lastX = 0;
      let lastTime = 0;
      let velocityX = 0;
      let startedInFooter = false;
      let lastTapTimestamp = 0;

      shell.addEventListener("pointerdown", (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        if (e.target && e.target.closest && e.target.closest("#story-bar-track")) return;

        activePointerId = e.pointerId;
        if (shell.setPointerCapture) {
          try { shell.setPointerCapture(e.pointerId); } catch (_) {}
        }

        updateViewportWidth();
        const footerEl = document.getElementById("cityscape-footer");
        const fRect = footerEl.getBoundingClientRect();
        startedInFooter = (e.clientY >= fRect.top + 16);

        // Grab live floating-point position immediately without snapping!
        isPointerDragging = true;
        isHorizontalDrag = false;
        startX = e.clientX;
        startY = e.clientY;
        dragStartPos = currentPos;
        lastX = e.clientX;
        lastTime = performance.now();
        velocityX = 0;
      });

      shell.addEventListener("pointermove", (e) => {
        if (activePointerId === null || e.pointerId !== activePointerId) return;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        if (!isHorizontalDrag) {
          if (Math.abs(dx) > 5 && Math.abs(dx) >= Math.abs(dy) * 0.75) {
            isHorizontalDrag = true;
          } else {
            return;
          }
        }

        const now = performance.now();
        const dt = Math.max(1, now - lastTime);
        const instVx = (e.clientX - lastX) / dt;
        // Smooth velocity estimation for crisp flick detection
        velocityX = velocityX * 0.35 + instVx * 0.65;
        lastX = e.clientX;
        lastTime = now;

        const maxIdx = DAYS_DATA.length - 1;
        let nextPos = dragStartPos - (dx / cachedViewportWidth);
        // Gentle rubber-band resistance at Day 1 (0) and Day 12 (11)
        if (nextPos < 0) nextPos = nextPos * 0.2;
        if (nextPos > maxIdx) nextPos = maxIdx + (nextPos - maxIdx) * 0.2;

        currentPos = Math.max(-0.18, Math.min(maxIdx + 0.18, nextPos));
        ensurePhysicsLoop();
      });

      function finishPointer(e) {
        if (activePointerId === null || e.pointerId !== activePointerId) return;
        activePointerId = null;
        isPointerDragging = false;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const dist = Math.hypot(dx, dy);
        const maxIdx = DAYS_DATA.length - 1;

        if (isHorizontalDrag) {
          // Determine target integer day from live floating position + flick velocity
          const projectedPos = currentPos - velocityX * 0.28;
          let nextTarget = Math.round(projectedPos);

          // Ensure a deliberate flick always advances at least 1 day in the swipe direction
          const baseDay = Math.round(dragStartPos);
          if (velocityX < -0.20 || dx < -36) {
            nextTarget = Math.max(nextTarget, Math.floor(dragStartPos) + 1);
          } else if (velocityX > 0.20 || dx > 36) {
            nextTarget = Math.min(nextTarget, Math.ceil(dragStartPos) - 1);
          }

          // Cap single swipe gesture to +/- 1 day from the gesture's starting base day
          nextTarget = Math.max(baseDay - 1, Math.min(baseDay + 1, nextTarget));
          glideToDay(Math.max(0, Math.min(maxIdx, nextTarget)));
        } else if (dist < 10) {
          // Single Clean Tap (Strict debounce guard prevents any double-fire)
          const now = performance.now();
          if (now - lastTapTimestamp > 220) {
            lastTapTimestamp = now;
            const settledDay = Math.round(currentPos);

            if (startedInFooter) {
              const q = DAYS_DATA[settledDay].mapQuery;
              window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`, "_blank", "noopener,noreferrer");
              glideToDay(settledDay);
            } else {
              const shellRect = shell.getBoundingClientRect();
              const relX = (e.clientX - shellRect.left) / Math.max(1, shellRect.width);
              if (relX >= 0.65 && settledDay < maxIdx) {
                glideToDay(settledDay + 1);
              } else if (relX <= 0.35 && settledDay > 0) {
                glideToDay(settledDay - 1);
              } else {
                glideToDay(settledDay);
              }
            }
          } else {
            glideToDay(targetDayIdx);
          }
        } else {
          glideToDay(Math.round(currentPos));
        }

        isHorizontalDrag = false;
        startedInFooter = false;
      }

      shell.addEventListener("pointerup", finishPointer);
      shell.addEventListener("pointercancel", finishPointer);
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" && targetDayIdx < DAYS_DATA.length - 1) {
        glideToDay(targetDayIdx + 1);
      } else if (e.key === "ArrowLeft" && targetDayIdx > 0) {
        glideToDay(targetDayIdx - 1);
      }
    });

    window.onload = async function () {
      updateViewportWidth();
      await loadScheduleJsonData();
      initSkyLayers();
      initTopStoryBar();
      initTimelineRail();
      initSchedulePanels();
      initCityscapeGroups();
      initFullScreenParticles();
      initTopBarScrubbing();
      initStageSwipeAndTap();
      renderAtPos(0);
    };
