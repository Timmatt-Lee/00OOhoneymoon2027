<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft Pastel Hokkaido Winter Sky to Sakura Blush Gradient -->
    <linearGradient id="bgPastel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="48%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>

    <!-- Soft Warm White Radial Highlight -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Heart Gradient -->
    <linearGradient id="heartFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Characters -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- 1. Bright Pastel Background -->
  <rect width="512" height="512" fill="url(#bgPastel)"/>
  <circle cx="256" cy="240" r="240" fill="url(#centerGlow)"/>

  <!-- 2. Big Crisp Snowflakes & Sparkles in Upper Corners -->
  <g fill="#ffffff" opacity="0.92">
    <circle cx="68" cy="112" r="10"/>
    <circle cx="444" cy="108" r="10"/>
    <circle cx="48" cy="216" r="7"/>
    <circle cx="462" cy="220" r="7"/>
    <!-- 4-Point Star Sparkle Left -->
    <path d="M 104,52 Q 104,76 80,76 Q 104,76 104,100 Q 104,76 128,76 Q 104,76 104,52 Z"/>
    <!-- 4-Point Star Sparkle Right -->
    <path d="M 408,52 Q 408,76 384,76 Q 408,76 408,100 Q 408,76 432,76 Q 408,76 408,52 Z"/>
  </g>

  <!-- 3. Big Center Love Heart (Top Center, Bold & Clear) -->
  <g transform="translate(256, 98)" filter="url(#cardShadow)">
    <path d="M 0,44 C -12,34 -58,2 -58,-28 C -58,-54 -36,-68 -16,-68 C -2,-68 0,-52 0,-52 C 0,-52 2,-68 16,-68 C 36,-68 58,-54 58,-28 C 58,2 12,34 0,44 Z"
          fill="url(#heartFill)" stroke="#3d2314" stroke-width="13" stroke-linejoin="round"/>
    <!-- Cute White Highlight on Heart -->
    <ellipse cx="-20" cy="-38" rx="11" ry="6" transform="rotate(-28 -20 -38)" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- 4. Bride's Translucent Flowing Veil (Behind Right Character) -->
  <path d="M 356,196 C 430,198 486,256 492,342 C 462,368 424,366 396,342 Z"
        fill="#ffffff" fill-opacity="0.78" stroke="#3d2314" stroke-width="12" stroke-linejoin="round"/>

  <!-- 5. LEFT CHARACTER: Chubby Mochi Groom (Kanahei Piske-inspired Round Snow Bird) -->
  <g filter="url(#cardShadow)">
    <!-- Big Round Squishy Mochi Body -->
    <path d="M 28,392 C 24,262 72,194 166,194 C 252,194 292,258 288,392 C 286,462 238,500 158,500 C 78,500 30,462 28,392 Z"
          fill="#ffffff" stroke="#3d2314" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cute Groom Top Hat (Jaunty Tilt, High Contrast) -->
    <g transform="translate(148, 184) rotate(-9)">
      <path d="M -38,6 L -32,-46 C -32,-56 32,-56 32,-46 L 38,6 Z"
            fill="#334155" stroke="#3d2314" stroke-width="13" stroke-linejoin="round"/>
      <!-- Sky Blue Satin Hat Ribbon -->
      <rect x="-35" y="-14" width="70" height="16" rx="4" fill="#38bdf8" stroke="#3d2314" stroke-width="10"/>
      <!-- Hat Brim -->
      <ellipse cx="0" cy="8" rx="58" ry="13" fill="#1e293b" stroke="#3d2314" stroke-width="13"/>
    </g>

    <!-- Big Rosy Pink Blush Cheeks -->
    <ellipse cx="88" cy="316" rx="26" ry="17" fill="#fb7185" opacity="0.65"/>
    <ellipse cx="232" cy="316" rx="26" ry="17" fill="#fb7185" opacity="0.65"/>

    <!-- Cute Kanahei-style Eyes (Close to Beak) -->
    <circle cx="118" cy="288" r="12" fill="#3d2314"/>
    <circle cx="114" cy="283" r="4.5" fill="#ffffff"/>
    <circle cx="204" cy="288" r="12" fill="#3d2314"/>
    <circle cx="200" cy="283" r="4.5" fill="#ffffff"/>

    <!-- Plump Golden-Orange Beak -->
    <ellipse cx="161" cy="294" rx="16" ry="11" fill="#fbbf24" stroke="#3d2314" stroke-width="11"/>

    <!-- Cute Groom Bow Tie -->
    <g transform="translate(161, 366)">
      <path d="M 0,0 L -36,-20 L -36,20 Z" fill="#0284c7" stroke="#3d2314" stroke-width="12" stroke-linejoin="round"/>
      <path d="M 0,0 L 36,-20 L 36,20 Z" fill="#0284c7" stroke="#3d2314" stroke-width="12" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="11" fill="#38bdf8" stroke="#3d2314" stroke-width="11"/>
    </g>
  </g>

  <!-- 6. RIGHT CHARACTER: Chubby Pink Bunny/Snow-Fairy Bride Snuggling Groom -->
  <g filter="url(#cardShadow)">
    <!-- Cute Chubby Lop Bunny Ears (Gives Instant Recognizable Silhouette!) -->
    <path d="M 296,210 C 276,136 306,108 328,136 C 342,154 338,194 328,212 Z"
          fill="#ffe4e6" stroke="#3d2314" stroke-width="14" stroke-linejoin="round"/>
    <path d="M 382,212 C 396,138 434,120 444,154 C 452,180 426,210 408,222 Z"
          fill="#ffe4e6" stroke="#3d2314" stroke-width="14" stroke-linejoin="round"/>
    <!-- Inner Pink Ear Shading -->
    <ellipse cx="312" cy="166" rx="8" ry="22" transform="rotate(-10 312 166)" fill="#fda4af"/>
    <ellipse cx="414" cy="172" rx="8" ry="22" transform="rotate(18 414 172)" fill="#fda4af"/>

    <!-- Big Round Squishy Pastel-Pink Mochi Body (Overlapping Snuggle) -->
    <path d="M 224,400 C 220,272 268,204 358,204 C 446,204 488,272 484,400 C 482,464 434,500 354,500 C 274,500 226,464 224,400 Z"
          fill="#ffe4e6" stroke="#3d2314" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- White Tummy Patch -->
    <ellipse cx="354" cy="420" rx="68" ry="54" fill="#ffffff"/>

    <!-- Cute Golden Bridal Crown / Tiara -->
    <g transform="translate(356, 198) rotate(4)">
      <path d="M -38,8 L -28,-26 L -10,-6 L 0,-34 L 10,-6 L 28,-26 L 38,8 Z"
            fill="#fde047" stroke="#3d2314" stroke-width="12" stroke-linejoin="round"/>
      <circle cx="0" cy="-34" r="7" fill="#fb7185" stroke="#3d2314" stroke-width="8"/>
    </g>

    <!-- Big Rosy Pink Blush Cheeks -->
    <ellipse cx="282" cy="326" rx="27" ry="18" fill="#fb7185" opacity="0.72"/>
    <ellipse cx="426" cy="326" rx="27" ry="18" fill="#fb7185" opacity="0.72"/>

    <!-- Happy Smiling Arc Eyes (^ ^) -->
    <path d="M 296,298 Q 312,276 328,298" fill="none" stroke="#3d2314" stroke-width="13" stroke-linecap="round"/>
    <path d="M 382,298 Q 398,276 414,298" fill="none" stroke="#3d2314" stroke-width="13" stroke-linecap="round"/>

    <!-- Cute Bunny Nose & W-Mouth (Kanahei Usagi Style!) -->
    <ellipse cx="355" cy="304" rx="9" ry="6.5" fill="#fb7185"/>
    <path d="M 341,316 Q 348,326 355,314 Q 362,326 369,316" fill="none" stroke="#3d2314" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bride's Pearl & Pink Heart Necklace -->
    <path d="M 304,358 Q 355,384 406,358" fill="none" stroke="#3d2314" stroke-width="10" stroke-linecap="round"/>
    <circle cx="355" cy="374" r="12" fill="#fb7185" stroke="#3d2314" stroke-width="9"/>
  </g>

  <!-- 7. Cute Snuggling Paws in the Middle & Bottom Snow Rim -->
  <ellipse cx="242" cy="360" rx="22" ry="16" transform="rotate(20 242 360)" fill="#ffffff" stroke="#3d2314" stroke-width="13"/>
  <ellipse cx="262" cy="378" rx="22" ry="16" transform="rotate(-20 262 378)" fill="#ffe4e6" stroke="#3d2314" stroke-width="13"/>

  <!-- Fluffy White Snow Foreground Curve at Very Bottom -->
  <path d="M -20,468 Q 130,442 256,462 T 532,456 L 532,530 L -20,530 Z"
        fill="#ffffff" stroke="#3d2314" stroke-width="13"/>
</svg>
