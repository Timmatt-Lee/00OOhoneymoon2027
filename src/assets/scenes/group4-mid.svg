<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 205" class="scene-svg" preserveAspectRatio="xMidYMax slice">
  <defs>
    <clipPath id="tengu-peak-clip">
      <path d="M 244,205 L 320,62 L 352,62 L 418,205 Z"/>
    </clipPath>
    <clipPath id="toya-island-clip">
      <path d="M 102,144 Q 142,112 182,144 Z"/>
    </clipPath>
  </defs>

  <!-- 0. Base Snow Foothills -->
  <rect id="foothills-base" x="0" y="156" width="920" height="49" fill="#cbd5e1"/>

  <!-- 1. Day 8 (x: 0..255): Lake Toya, Nakajima Island & Pleasure Boat -->
  <g id="day8-lake-toya">
    <rect x="0" y="142" width="255" height="56" fill="#0284c7" opacity="0.88"/>
    <path d="M 102,144 Q 142,112 182,144 Z" fill="#1e293b"/>
    <rect x="100" y="110" width="84" height="18" fill="#ffffff" opacity="0.92" clip-path="url(#toya-island-clip)"/>
    <g id="toya-boat" transform="translate(38, 128)">
      <polygon points="0,10 42,10 36,16 6,16" fill="#ffffff"/>
      <rect x="7" y="4" width="26" height="6" rx="1.5" fill="#0f172a"/>
      <rect x="14" y="0" width="12" height="4" rx="1" fill="#ef4444"/>
    </g>
    <g class="water-shimmer" fill="#e0f2fe">
      <rect x="28" y="152" width="64" height="2.5" rx="1.2"/>
      <rect x="118" y="156" width="78" height="2.5" rx="1.2"/>
    </g>
  </g>

  <!-- 2. Day 9 (x: 244..418): Otaru Mt. Tengu Ropeway & Summit Observatory -->
  <g id="day9-otaru-ropeway">
    <path d="M 244,205 L 320,62 L 352,62 L 418,205 Z" fill="#1e293b" opacity="0.92"/>
    <polygon points="290,94 320,58 352,58 382,94 354,86 336,94 318,86" fill="#ffffff" opacity="0.92" clip-path="url(#tengu-peak-clip)"/>
    <!-- Lower Base Station -->
    <rect x="262" y="134" width="30" height="64" rx="2" fill="#0f172a"/>
    <polygon points="259,135 277,123 295,135" fill="#ffffff"/>
    <rect x="269" y="140" width="16" height="6" rx="1" fill="#fde047"/>
    <!-- Summit Observatory Seated Cleanly on Ridge Plateau (320..352) -->
    <rect x="322" y="48" width="28" height="14" rx="2" fill="#0f172a"/>
    <polygon points="319,49 336,40 353,49" fill="#ffffff"/>
    <rect x="327" y="52" width="18" height="4.5" rx="1" fill="#fde047"/>
    <!-- Support Pylon & Cable -->
    <line x1="304" y1="92" x2="298" y2="124" stroke="#94a3b8" stroke-width="2.5"/>
    <line x1="304" y1="92" x2="310" y2="124" stroke="#94a3b8" stroke-width="2.5"/>
    <line x1="299" y1="92" x2="309" y2="92" stroke="#ffffff" stroke-width="2.5"/>
    <polyline points="277,128 304,92 326,54" fill="none" stroke="#e2e8f0" stroke-width="2.2"/>
    <!-- Red Gondola Cabin -->
    <line x1="314" y1="75" x2="314" y2="82" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="304" y="82" width="20" height="13" rx="3" fill="#dc2626" stroke="#ffffff" stroke-width="1"/>
    <rect x="307" y="85" width="6" height="5" rx="0.8" fill="#fde047"/>
    <rect x="315" y="85" width="6" height="5" rx="0.8" fill="#fde047"/>
  </g>

  <!-- 3. Day 10 (x: 404..520): Otaru Canal Brick Warehouses -->
  <g id="day10-otaru-warehouses">
    <path d="M 404,205 L 404,118 L 433,98 L 462,118 L 491,98 L 520,118 L 520,205 Z" fill="#1e293b"/>
    <polyline points="402,119 433,97 462,119 491,97 522,119" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 4. Day 11 (x: 532..674): Sapporo NORBESA Ferris Wheel & TV Tower -->
  <g id="day11-sapporo-skyline">
    <circle class="ferris-wheel-spin" cx="566" cy="90" r="25" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="566" cy="90" r="15" fill="none" stroke="#fde047" stroke-width="1.5"/>
    <circle cx="566" cy="90" r="4" fill="#fde047"/>
    <line x1="566" y1="90" x2="554" y2="120" stroke="#0f172a" stroke-width="3.5"/>
    <line x1="566" y1="90" x2="578" y2="120" stroke="#0f172a" stroke-width="3.5"/>
    <rect x="532" y="118" width="68" height="87" fill="#0f172a"/>
    <rect x="530" y="115" width="72" height="4" rx="2" fill="#ffffff"/>
    <g fill="#fde047" opacity="0.85">
      <rect x="542" y="128" width="12" height="6" rx="1"/>
      <rect x="560" y="128" width="12" height="6" rx="1"/>
      <rect x="578" y="128" width="12" height="6" rx="1"/>
      <rect x="542" y="142" width="12" height="6" rx="1"/>
      <rect x="560" y="142" width="12" height="6" rx="1"/>
      <rect x="578" y="142" width="12" height="6" rx="1"/>
    </g>
    <path d="M 618,205 L 638,84 L 646,36 L 654,84 L 674,205 Z" fill="#0f172a"/>
    <circle cx="646" cy="34" r="3.5" fill="#fb7185"/>
    <rect x="636" y="84" width="20" height="7" rx="1.5" fill="#fde047"/>
  </g>

  <!-- 5. Day 12 (x: 682..852): New Chitose Airport Terminal & Control Tower -->
  <g id="day12-chitose-airport">
    <path d="M 682,205 L 682,130 L 740,130 L 744,86 L 734,74 L 764,74 L 754,86 L 758,130 L 852,130 L 852,205 Z" fill="#1e1b4b"/>
    <line x1="680" y1="130" x2="854" y2="130" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="738" y="77" width="22" height="5" rx="1" fill="#fde047"/>
    <g fill="#fde047" opacity="0.85">
      <rect x="696" y="140" width="24" height="8" rx="1.5"/>
      <rect x="730" y="140" width="24" height="8" rx="1.5"/>
      <rect x="764" y="140" width="24" height="8" rx="1.5"/>
      <rect x="798" y="140" width="24" height="8" rx="1.5"/>
    </g>
  </g>
</svg>
