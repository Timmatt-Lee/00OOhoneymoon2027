<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 205" class="scene-svg" preserveAspectRatio="xMidYMax slice">
              <!-- Continuous Mid-ground Snow Foothills Base -->
              <rect x="0" y="156" width="920" height="49" fill="#cbd5e1"/>

              <!-- DAY 8 (3/9): Calm Lake Toya Surface Extending Down to Snow Shoreline -->
              <rect x="0" y="142" width="320" height="56" fill="#0284c7" opacity="0.88"/>
              <!-- Nakajima Island in the middle of Lake Toya -->
              <path d="M 145,144 Q 182,114 220,144 Z" fill="#1e293b"/>
              <path d="M 162,131 Q 182,114 202,131 Z" fill="#ffffff" opacity="0.9"/>
              <!-- Lake Toya Sightseeing Pleasure Boat -->
              <g transform="translate(76, 128)">
                <polygon points="0,10 42,10 36,16 6,16" fill="#ffffff"/>
                <rect x="7" y="4" width="26" height="6" rx="1.5" fill="#0f172a"/>
                <rect x="14" y="0" width="12" height="4" rx="1" fill="#ef4444"/>
              </g>
              <g class="water-shimmer" fill="#e0f2fe">
                <rect x="44" y="152" width="68" height="2.5" rx="1.2"/>
                <rect x="156" y="156" width="84" height="2.5" rx="1.2"/>
              </g>

              <!-- DAY 9–10 (3/10–3/11): SELF-CONTAINED ROPEWAY MOUNTAIN ANCHORED TO 205 -->
              <g>
                <!-- Ropeway Mountain Peak Grounded to 205 -->
                <path d="M 262,205 L 382,58 L 492,205 Z" fill="#1e293b" opacity="0.9"/>
                <polygon points="382,58 352,92 382,82 412,92" fill="#ffffff" opacity="0.9"/>
                <!-- Lower Base Station House Grounded to Snow -->
                <rect x="292" y="132" width="32" height="66" rx="2" fill="#0f172a"/>
                <polygon points="288,133 308,120 328,133" fill="#ffffff"/>
                <rect x="300" y="138" width="16" height="6" rx="1" fill="#fde047"/>
                <!-- Summit Ropeway Station & Observatory on Peak -->
                <rect x="366" y="48" width="32" height="16" rx="2" fill="#0f172a"/>
                <polygon points="363,49 382,39 401,49" fill="#ffffff"/>
                <rect x="372" y="52" width="20" height="5" rx="1" fill="#fde047"/>
                <!-- Intermediate Support Pylon Tower on Slope -->
                <line x1="342" y1="92" x2="336" y2="126" stroke="#94a3b8" stroke-width="2.5"/>
                <line x1="342" y1="92" x2="348" y2="126" stroke="#94a3b8" stroke-width="2.5"/>
                <line x1="337" y1="92" x2="347" y2="92" fill="none" stroke="#ffffff" stroke-width="2.5"/>
                <!-- Continuous Ropeway Cable Line -->
                <polyline points="310,127 342,92 372,54" fill="none" stroke="#e2e8f0" stroke-width="2.2"/>
                <!-- Red Ropeway Gondola Cabin -->
                <line x1="354" y1="77" x2="354" y2="84" stroke="#e2e8f0" stroke-width="2"/>
                <rect x="344" y="84" width="20" height="13" rx="3" fill="#dc2626" stroke="#ffffff" stroke-width="1"/>
                <rect x="347" y="87" width="6" height="5" rx="0.8" fill="#fde047"/>
                <rect x="355" y="87" width="6" height="5" rx="0.8" fill="#fde047"/>
              </g>

              <!-- Otaru Canal Brick Warehouses Grounded to 205 -->
              <path d="M 382,205 L 382,118 L 416,98 L 450,118 L 484,98 L 518,118 L 518,205 Z" fill="#1e293b"/>
              <polyline points="380,119 416,97 450,119 484,97 520,119" fill="none" stroke="#ffffff" stroke-width="3.5"/>

              <!-- Sapporo NORBESA Building + Rooftop Ferris Wheel Anchored on Roof! -->
              <g>
                <circle class="ferris-wheel-spin" cx="566" cy="90" r="25" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6 4"/>
                <circle cx="566" cy="90" r="15" fill="none" stroke="#fde047" stroke-width="1.5"/>
                <circle cx="566" cy="90" r="4" fill="#fde047"/>
                <line x1="566" y1="90" x2="554" y2="120" stroke="#0f172a" stroke-width="3.5"/>
                <line x1="566" y1="90" x2="578" y2="120" stroke="#0f172a" stroke-width="3.5"/>
                <!-- NORBESA Commercial Building Underneath the Ferris Wheel -->
                <rect x="532" y="118" width="68" height="87" fill="#0f172a"/>
                <rect x="530" y="115" width="72" height="4" rx="2" fill="#ffffff"/>
                <g fill="#fde047" opacity="0.85">
                  <rect x="542" y="128" width="12" height="6" rx="1"/>
                  <rect x="560" y="128" width="12" height="6" rx="1"/>
                  <rect x="578" y="128" width="12" height="6" rx="1"/>
                  <rect x="542" y="142" width="12" height="6" rx="1"/>
                  <rect x="560" y="142" width="12" height="6" rx="1"/>
                  <rect x="578" y="142" width="12" height="6" rx="1"/>
                </g>
              </g>

              <!-- Sapporo TV Tower Grounded to 205 -->
              <path d="M 618,205 L 638,84 L 646,36 L 654,84 L 674,205 Z" fill="#0f172a"/>
              <circle cx="646" cy="34" r="3.5" fill="#fb7185"/>
              <rect x="636" y="84" width="20" height="7" rx="1.5" fill="#fde047"/>

              <!-- Day 12 (3/13): New Chitose Airport Terminal & Control Tower Grounded to 205 -->
              <path d="M 672,205 L 672,130 L 736,130 L 740,86 L 730,74 L 760,74 L 750,86 L 754,130 L 848,130 L 848,205 Z" fill="#1e1b4b"/>
              <line x1="670" y1="130" x2="850" y2="130" stroke="#ffffff" stroke-width="3.5"/>
              <rect x="734" y="77" width="22" height="5" rx="1" fill="#fde047"/>
              <g fill="#fde047" opacity="0.85">
                <rect x="688" y="140" width="24" height="8" rx="1.5"/>
                <rect x="722" y="140" width="24" height="8" rx="1.5"/>
                <rect x="756" y="140" width="24" height="8" rx="1.5"/>
                <rect x="790" y="140" width="24" height="8" rx="1.5"/>
              </g>
            </svg>
