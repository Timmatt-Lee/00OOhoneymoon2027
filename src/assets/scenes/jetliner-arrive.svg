  <!-- Crimson Accent Cheatline (Matches JR Train & Ferris Wheel #f43f5e) -->
  <line x1="16" y1="20" x2="94" y2="20" stroke="#f43f5e" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Swept Near Wing & Engine Pod with Bold 2.8px White Leading Edge -->
  <polygon points="56,20 38,33 48,33 68,20" fill="#1e293b"/>
  <line x1="68" y1="20" x2="48" y2="33" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round"/>
  <rect x="46" y="23" width="12" height="5" rx="2.5" fill="#0f172a" stroke="#ffffff" stroke-width="2.2"/>
  <!-- Warm Lit Cockpit & Cabin Windows (#fde047) -->
  <polygon points="95,18 88,15.5 86,18 93,19" fill="#bae6fd"/>
  <g fill="#fde047">
    <rect x="76" y="15.5" width="4.5" height="2.8" rx="0.8"/>
    <rect x="68" y="15.5" width="4.5" height="2.8" rx="0.8"/>
    <rect x="60" y="15.5" width="4.5" height="2.8" rx="0.8"/>
    <rect x="52" y="15.5" width="4.5" height="2.8" rx="0.8"/>
    <rect x="44" y="15.5" width="4.5" height="2.8" rx="0.8"/>
    <rect x="36" y="15.5" width="4.5" height="2.8" rx="0.8"/>
    <rect x="28" y="15.5" width="4.5" height="2.8" rx="0.8"/>
