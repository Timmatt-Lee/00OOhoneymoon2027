<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 38" class="jetliner-svg">
  <!-- Far Wing -->
  <polygon points="44,14 30,5 22,5 34,14" fill="#334155"/>
  <!-- Solid Fuselage & Tail Fin (Matches #0f172a Building Silhouette Style) -->
  <path d="M 102,20 C 94,14 82,13 68,13 L 26,13 L 12,2 L 3,2 L 11,15 L 6,17 C 11,20 20,22 30,22 L 88,22 C 96,22 102,21 102,20 Z" fill="#0f172a"/>
